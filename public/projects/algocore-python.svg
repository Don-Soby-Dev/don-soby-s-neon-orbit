<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030508"/>
      <stop offset="50%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#0a0e1c"/>
    </linearGradient>
    <linearGradient id="cyanViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Subtle Grid -->
  <pattern id="smallGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1280" height="720" fill="url(#smallGrid)" />

  <!-- Mockup Window Frame -->
  <rect x="60" y="50" width="1160" height="620" rx="16" fill="#090d16" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
  
  <!-- Window Header Bar -->
  <path d="M 60 66 A 16 16 0 0 1 76 50 L 1204 50 A 16 16 0 0 1 1220 66 L 1220 100 L 60 100 Z" fill="#0c121e" />
  <line x1="60" y1="100" x2="1220" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="95" cy="75" r="6" fill="#ff5f56"/>
  <circle cx="115" cy="75" r="6" fill="#ffbd2e"/>
  <circle cx="135" cy="75" r="6" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="640" y="79" fill="rgba(255,255,255,0.6)" font-family="JetBrains Mono, monospace" font-size="13" text-anchor="middle">algocore.py — Python 3.12 Algorithmic Benchmark Engine</text>

  <!-- Left Column: Code Editor -->
  <rect x="85" y="125" width="560" height="520" rx="10" fill="#05070d" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <text x="110" y="165" fill="#00d4ff" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold"># Dijkstra Shortest Path with Min-Heap</text>
  <text x="110" y="195" fill="#8b5cf6" font-family="JetBrains Mono, monospace" font-size="13">import heapq</text>
  <text x="110" y="225" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="13">def dijkstra(graph, start):</text>
  <text x="130" y="255" fill="rgba(255,255,255,0.7)" font-family="JetBrains Mono, monospace" font-size="13">distances = {node: float('inf') for node in graph}</text>
  <text x="130" y="285" fill="rgba(255,255,255,0.7)" font-family="JetBrains Mono, monospace" font-size="13">distances[start] = 0</text>
  <text x="130" y="315" fill="rgba(255,255,255,0.7)" font-family="JetBrains Mono, monospace" font-size="13">pq = [(0, start)]</text>
  <text x="130" y="355" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="13">while pq:</text>
  <text x="150" y="385" fill="rgba(255,255,255,0.7)" font-family="JetBrains Mono, monospace" font-size="13">cur_dist, u = heapq.heappop(pq)</text>
  <text x="150" y="415" fill="rgba(255,255,255,0.7)" font-family="JetBrains Mono, monospace" font-size="13">if cur_dist > distances[u]: continue</text>
  <text x="150" y="445" fill="rgba(255,255,255,0.7)" font-family="JetBrains Mono, monospace" font-size="13">for v, weight in graph[u].items():</text>
  <text x="170" y="475" fill="rgba(255,255,255,0.7)" font-family="JetBrains Mono, monospace" font-size="13">if cur_dist + weight &lt; distances[v]:</text>
  <text x="190" y="505" fill="#00d4ff" font-family="JetBrains Mono, monospace" font-size="13">distances[v] = cur_dist + weight</text>
  <text x="190" y="535" fill="rgba(255,255,255,0.7)" font-family="JetBrains Mono, monospace" font-size="13">heapq.heappush(pq, (distances[v], v))</text>
  <text x="130" y="575" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="13">return distances  # O((V + E) log V)</text>

  <!-- Right Column: Graph Visualizer & Metrics -->
  <rect x="670" y="125" width="525" height="280" rx="10" fill="#05070d" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="695" y="160" fill="rgba(255,255,255,0.6)" font-family="JetBrains Mono, monospace" font-size="12" uppercase="true">Topological Graph Traversal</text>

  <!-- Connected Nodes -->
  <line x1="750" y1="240" x2="860" y2="200" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
  <line x1="860" y1="200" x2="980" y2="230" stroke="#00d4ff" stroke-width="2" opacity="0.8"/>
  <line x1="750" y1="240" x2="840" y2="320" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
  <line x1="840" y1="320" x2="980" y2="230" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
  <line x1="980" y1="230" x2="1100" y2="270" stroke="#10b981" stroke-width="2" opacity="0.8"/>
  <line x1="840" y1="320" x2="1050" y2="340" stroke="#8b5cf6" stroke-width="2" opacity="0.4"/>
  <line x1="1050" y1="340" x2="1100" y2="270" stroke="#10b981" stroke-width="2" opacity="0.8"/>

  <!-- Nodes with Glow -->
  <circle cx="750" cy="240" r="18" fill="#090d16" stroke="#00d4ff" stroke-width="3" filter="url(#glow)"/>
  <text x="750" y="245" fill="#fff" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" text-anchor="middle">A</text>

  <circle cx="860" cy="200" r="18" fill="#090d16" stroke="#00d4ff" stroke-width="3" filter="url(#glow)"/>
  <text x="860" y="205" fill="#fff" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" text-anchor="middle">B</text>

  <circle cx="840" cy="320" r="18" fill="#090d16" stroke="#8b5cf6" stroke-width="3"/>
  <text x="840" y="325" fill="#fff" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" text-anchor="middle">C</text>

  <circle cx="980" cy="230" r="22" fill="#00d4ff" stroke="#fff" stroke-width="3" filter="url(#glow)"/>
  <text x="980" y="235" fill="#030508" font-family="JetBrains Mono, monospace" font-size="13" font-weight="bold" text-anchor="middle">D*</text>

  <circle cx="1050" cy="340" r="16" fill="#090d16" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1050" y="344" fill="#fff" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">E</text>

  <circle cx="1100" cy="270" r="20" fill="#10b981" stroke="#fff" stroke-width="2"/>
  <text x="1100" y="275" fill="#030508" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" text-anchor="middle">Z</text>

  <!-- Benchmark KPI Cards -->
  <rect x="670" y="425" width="165" height="100" rx="8" fill="#0c121e" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="690" y="465" fill="#00d4ff" font-family="JetBrains Mono, monospace" font-size="24" font-weight="bold">O(log n)</text>
  <text x="690" y="495" fill="rgba(255,255,255,0.5)" font-family="JetBrains Mono, monospace" font-size="11">HEAP LOOKUP</text>

  <rect x="850" y="425" width="165" height="100" rx="8" fill="#0c121e" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="870" y="465" fill="#8b5cf6" font-family="JetBrains Mono, monospace" font-size="24" font-weight="bold">50+ Algos</text>
  <text x="870" y="495" fill="rgba(255,255,255,0.5)" font-family="JetBrains Mono, monospace" font-size="11">IMPLEMENTED</text>

  <rect x="1030" y="425" width="165" height="100" rx="8" fill="#0c121e" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="1050" y="465" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="24" font-weight="bold">0.84ms</text>
  <text x="1050" y="495" fill="rgba(255,255,255,0.5)" font-family="JetBrains Mono, monospace" font-size="11">10K NODES PASS</text>

  <!-- Live Status Bar -->
  <rect x="670" y="545" width="525" height="100" rx="8" fill="#05070d" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="695" y="580" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="12">✓ All test suites passing (pytest -v)</text>
  <text x="695" y="615" fill="rgba(255,255,255,0.6)" font-family="JetBrains Mono, monospace" font-size="12">Verified: Graphs, Dynamic Programming, Binary Search Trees, Tries</text>
</svg>
